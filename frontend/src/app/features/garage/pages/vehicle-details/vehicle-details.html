@if(vehicle){

<div class="mb-6 space-y-8">

    <app-vehicle-hero
        [vehicle]="vehicle">
    </app-vehicle-hero>

    <app-vehicle-tabs
    [activeTab]="selectedTab()"
    (tabChanged)="selectedTab.set($event)">
</app-vehicle-tabs>

<div class="mt-8">

    @if(selectedTab() === 'Overview'){

        <app-overview
            [vehicle]="vehicle">
        </app-overview>

    }

    @if(selectedTab() === 'Fuel'){

        <app-fuel></app-fuel>

    }

    @if(selectedTab() === 'Maintenance'){

        <app-maintenance></app-maintenance>

    }

    @if(selectedTab() === 'Expenses'){

        <app-expenses></app-expenses>

    }

    @if(selectedTab() === 'Modifications'){

        <app-modifications></app-modifications>

    }

    @if(selectedTab() === 'Gallery'){

        <app-gallery></app-gallery>

    }

</div>
</div>

} @else {

<div class="rounded-xl bg-red-900/20 p-8">

    <h2 class="text-2xl font-bold text-red-400">

        Vehicle not found

    </h2>

</div>

}
