<h2 mat-dialog-title>

    {{ data ? 'Edit Maintenance' : 'Add Maintenance' }}

</h2>

<form [formGroup]="maintenanceForm">

    <mat-dialog-content class="grid gap-4">

        <mat-form-field appearance="outline">

            <mat-label>Date</mat-label>

            <input
                matInput
                type="date"
                formControlName="date">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Maintenance Type</mat-label>

            <input
                matInput
                formControlName="type">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Description</mat-label>

            <input
                matInput
                formControlName="description">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Workshop</mat-label>

            <input
                matInput
                formControlName="workshop">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Cost (€)</mat-label>

            <input
                matInput
                type="number"
                formControlName="cost">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Mileage</mat-label>

            <input
                matInput
                type="number"
                formControlName="mileage">

        </mat-form-field>

        <mat-form-field appearance="outline">

            <mat-label>Notes</mat-label>

            <textarea
                matInput
                rows="3"
                formControlName="notes">
            </textarea>

        </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="end">

        <button
            mat-button
            type="button"
            (click)="cancel()">

            Cancel

        </button>

        <button
            mat-flat-button
            color="primary"
            type="button"
            (click)="save()"
            [disabled]="maintenanceForm.invalid">

            Save

        </button>

    </mat-dialog-actions>

</form>
