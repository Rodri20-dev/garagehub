<h2 mat-dialog-title>

    Delete Expense Record

</h2>

<mat-dialog-content>

    <p class="text-slate-600">

        Are you sure you want to delete this expense record?
        This action cannot be undone.

    </p>

</mat-dialog-content>

<mat-dialog-actions
    align="end"
    class="gap-3">

    <button
        mat-button
        (click)="cancel()">

        Cancel

    </button>

    <button
        mat-flat-button
        color="warn"
        (click)="confirm()">

        Delete

    </button>

</mat-dialog-actions>
