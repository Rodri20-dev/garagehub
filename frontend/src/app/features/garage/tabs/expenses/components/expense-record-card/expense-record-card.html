<div
    class="mb-6 rounded-2xl border border-slate-700 bg-slate-800 p-6 shadow-lg">

    <div class="flex items-center justify-between">

        <div>

            <h3 class="text-lg font-bold text-white">

                {{ record().category }}

            </h3>

            <p class="text-slate-400">

                {{ formatDate(record().date) }}

            </p>

        </div>

        <span
            class="rounded-lg bg-blue-600 px-3 py-1 text-sm text-white">

            €{{ record().amount }}

        </span>

    </div>

    <div class="mt-6 space-y-2">

        <div>

            <p class="text-sm text-slate-400">

                Description

            </p>

            <p class="text-white">

                {{ record().description }}

            </p>

        </div>

        <div>

            <p class="text-sm text-slate-400">

                Shop

            </p>

            <p class="text-white">

                {{ record().shop }}

            </p>

        </div>

        @if(record().notes){

            <div>

                <p class="text-sm text-slate-400">

                    Notes

                </p>

                <p class="text-white">

                    {{ record().notes }}

                </p>

            </div>

        }

    </div>

    <div class="mt-6 flex justify-end gap-2">

        <button
            type="button"
            (click)="onEdit()"
            class="rounded-lg px-3 py-2 text-sm font-medium text-blue-400 hover:bg-blue-500/10">

            ✏ Edit

        </button>

        <button
            type="button"
            (click)="onDelete()"
            class="rounded-lg px-3 py-2 text-sm font-medium text-red-400 hover:bg-red-500/10">

            🗑 Delete

        </button>

    </div>

</div>
