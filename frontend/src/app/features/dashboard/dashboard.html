<app-page-header
    title="Dashboard"
    subtitle="Manage your garage in one place">
</app-page-header>

<div class="mt-8 grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-4">

    <app-stat-card
    title="Vehicles"
    [value]="stats.totalVehicles.toString()"
    subtitle="Registered vehicles"
    icon="🚗"
    accentColor="bg-blue-600">
</app-stat-card>

<app-stat-card
    title="Fuel Records"
    [value]="stats.totalFuelRecords.toString()"
    subtitle="Total refuels"
    icon="⛽"
    accentColor="bg-green-600">
</app-stat-card>

<app-stat-card
    title="Maintenance"
    [value]="stats.pendingMaintenance.toString()"
    subtitle="Pending services"
    icon="🔧"
    accentColor="bg-amber-500">
</app-stat-card>

<app-stat-card
    title="Expenses"
    [value]="stats.totalExpenses + ' €'"
    subtitle="Total expenses"
    icon="💰"
    accentColor="bg-red-600">
</app-stat-card>

</div>

<div class="mt-10 grid grid-cols-1 gap-6 xl:grid-cols-3">

    <div class="xl:col-span-2">
        <app-fuel-chart />
    </div>

    <app-recent-activity />

</div>
