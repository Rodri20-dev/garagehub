<div
    class="mb-6 overflow-hidden rounded-2xl border border-slate-700 bg-slate-800">

    <!-- Foto -->

    <img
        [src]="vehicle().image"
        [alt]="vehicle().brand + ' ' + vehicle().model"
        class="h-72 w-full object-cover">

    <!-- Informação -->

    <div class="space-y-4 p-8">

        <div>

            <h1 class="text-4xl font-bold text-white">

                {{ vehicle().brand }}
                {{ vehicle().model }}

            </h1>

            <p class="mt-2 text-lg text-slate-400">

                {{ vehicle().generation }}
                •
                {{ vehicle().version }}

            </p>

        </div>

        <div class="flex flex-wrap gap-3">

            <span
                class="rounded-lg bg-slate-700 px-4 py-2 text-slate-300">

                {{ vehicle().engine }}

            </span>

            <span
                class="rounded-lg bg-slate-700 px-4 py-2 text-slate-300">

                {{ vehicle().horsepower }} HP

            </span>

            <span
                class="rounded-lg bg-slate-700 px-4 py-2 text-slate-300">

                {{ vehicle().transmission }}

            </span>

            <span
                class="rounded-lg bg-slate-700 px-4 py-2 text-slate-300">

                {{ vehicle().fuel }}

            </span>

        </div>

    </div>

</div>
