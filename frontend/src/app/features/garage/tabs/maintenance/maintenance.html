<div class="space-y-6">

    <div class="flex justify-end">

        <app-add-maintenance-button
            (clicked)="openAddMaintenanceDialog()">
        </app-add-maintenance-button>

    </div>

    <app-maintenance-summary
        [records]="records()">
    </app-maintenance-summary>

    <app-maintenance-history
        [records]="records()"
        (edit)="editMaintenance($event)"
        (delete)="deleteMaintenance($event)">
    </app-maintenance-history>

</div>
