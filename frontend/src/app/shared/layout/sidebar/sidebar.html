<aside class="flex h-screen w-72 flex-col border-r border-slate-800 bg-slate-900">

  <!-- Logo -->
  <div class="flex items-center gap-4 border-b border-slate-800 p-6">

    <div
      class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-xl font-bold text-white">

      GH

    </div>

    <div>

      <h1 class="text-lg font-bold text-white">
        GarageHub
      </h1>

      <p class="text-sm text-slate-400">
        Automotive Manager
      </p>

    </div>

  </div>

  <!-- Menu -->
  <nav class="flex-1 px-4 py-6">

    @for(item of navigationItems; track item.route){

        <a
            [routerLink]="item.route"
            routerLinkActive="bg-slate-800 text-white"
            class="mb-2 flex items-center gap-3 rounded-xl px-4 py-3 text-slate-400 transition-all hover:bg-slate-800 hover:text-white">

            <lucide-angular
                [img]="item.icon"
                class="h-5 w-5">
            </lucide-angular>

            <span>
                {{ item.label }}
            </span>

        </a>

    }

  </nav>

  <!-- Footer -->

  <div class="border-t border-slate-800 p-6">

    <div class="text-sm text-slate-400">

      GarageHub v1.0

    </div>

  </div>

</aside>
