<div class="space-y-6">

    <div class="flex justify-end">

        <app-add-expense-button 
            (clicked)="openAddExpenseDialog()">
        </app-add-expense-button>

    </div>

    <app-expenses-summary
        [records]="records()">
    </app-expenses-summary>

    <app-expenses-history
        [records]="records()"
        (edit)="editExpense($event)"
        (delete)="deleteExpense($event)">
    </app-expenses-history>

</div>
