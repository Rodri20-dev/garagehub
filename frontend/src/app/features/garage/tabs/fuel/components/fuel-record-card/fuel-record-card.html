<div
    class="flex h-full flex-col
           rounded-2xl
           border border-slate-700
           bg-slate-800
           p-6
           shadow-lg
           transition
           hover:border-blue-500
           hover:shadow-xl">

    <div class="flex items-center justify-between">

        <div>

            <h3 class="text-lg font-bold text-white">

                {{ record().gasStation }}

            </h3>

            <p class="text-slate-400">

                {{ formatDate(record().date) }}

            </p>

        </div>

        <span
            class="rounded-lg bg-blue-600 px-3 py-1 text-sm text-white">

            {{ record().fuelType }}

        </span>

    </div>

    <div class="mt-6 grid grid-cols-2 gap-4">

        <div>

            <p class="text-sm text-slate-400">

                Liters

            </p>

            <p class="text-xl font-bold text-white">

                {{ record().liters }} L

            </p>

        </div>

        <div>

            <p class="text-sm text-slate-400">

                Total

            </p>

            <p class="text-xl font-bold text-white">

                €{{ record().totalCost }}

            </p>

        </div>

        <div>

            <p class="text-sm text-slate-400">

                Price/L

            </p>

            <p class="text-white">

                €{{ record().pricePerLiter }}

            </p>

        </div>

        <div>

            <p class="text-sm text-slate-400">

                Mileage

            </p>

            <p class="text-white">

                {{ record().mileage.toLocaleString() }} km

            </p>

        </div>

    </div>

    <div class="mt-4 flex justify-end gap-2">

        <button
            type="button"
            (click)="onEdit()"
            class="rounded-lg px-3 py-2 text-sm font-medium text-blue-400 hover:bg-blue-500/10">

            ✏ Edit

        </button>

        <button
            type="button"
            (click)="onDelete()"
            class="rounded-lg px-3 py-2 text-sm font-medium text-red-400 hover:bg-red-500/10">

            🗑 Delete

        </button>

    </div>
</div>
