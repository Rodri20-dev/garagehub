<div
    class="overflow-hidden rounded-2xl border border-slate-700 bg-slate-800 shadow-lg transition duration-300 hover:-translate-y-1 hover:border-blue-500">

    <!-- Image -->

    <div class="h-52 overflow-hidden bg-slate-700">

        <img
            [src]="vehicle().image"
            [alt]="vehicle().brand + ' ' + vehicle().model"
            class="h-full w-full object-cover" />

    </div>

    <!-- Content -->

    <div class="space-y-4 p-6">

        <div>

            <h2 class="text-2xl font-bold text-white">

                {{ vehicle().brand }}
                {{ vehicle().model }}

            </h2>

            <p class="text-slate-400">

                {{ vehicle().generation }}
                •
                {{ vehicle().version }}

            </p>

        </div>

        <div class="flex flex-wrap gap-2">

            <span
                class="rounded-lg bg-slate-700 px-3 py-1 text-sm text-slate-300">

                {{ vehicle().engine }}

            </span>

            <span
                class="rounded-lg bg-slate-700 px-3 py-1 text-sm text-slate-300">

                {{ vehicle().horsepower }} HP

            </span>

            <span
                class="rounded-lg bg-slate-700 px-3 py-1 text-sm text-slate-300">

                {{ vehicle().transmission }}

            </span>

        </div>

        <div class="text-slate-300">

            {{ vehicle().mileage.toLocaleString() }} km

        </div>

        <button
            class="w-full rounded-xl bg-blue-600 py-3 font-semibold text-white transition hover:bg-blue-700">

            View Details

        </button>

    </div>

</div>
